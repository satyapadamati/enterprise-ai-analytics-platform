name: CI/CD Pipeline

on:
  push:
    branches: [test, develop, main]
  pull_request:
    branches: [test, develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check FastAPI app import
        working-directory: backend
        run: |
          python -c "from app.main import app; print('FastAPI app is ready')"

  frontend-check:
    name: Frontend check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint React app
        working-directory: frontend
        run: npm run lint

      - name: Build React app
        working-directory: frontend
        run: npm run build

  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: backend-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ vars.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Test backend container
        run: |
          docker run -d --name backend-test -p 8000:8000 ${{ vars.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          for i in {1..15}; do
            if curl -sf http://localhost:8000/api/v1/health; then
              echo "Backend is healthy"
              docker stop backend-test
              exit 0
            fi
            sleep 2
          done
          echo "Backend logs:"
          docker logs backend-test
          docker stop backend-test
          exit 1

  frontend-image:
    name: Build frontend image
    runs-on: ubuntu-latest
    needs: frontend-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ vars.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Test frontend container
        run: |
          docker run -d --name frontend-test -p 8080:80 ${{ vars.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          for i in {1..15}; do
            if curl -sf http://localhost:8080/; then
              echo "Frontend is healthy"
              docker stop frontend-test
              exit 0
            fi
            sleep 2
          done
          echo "Frontend logs:"
          docker logs frontend-test
          docker stop frontend-test
          exit 1

  future-deploy-note:
    name: Future ECR/ECS note
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Future deployment note
        run: |
          echo "CI passed on main."
          echo "Add ECR push and ECS deploy jobs later when AWS secrets and services are ready."
