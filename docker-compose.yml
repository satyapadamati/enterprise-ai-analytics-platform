services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-analytics-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-analytics-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
