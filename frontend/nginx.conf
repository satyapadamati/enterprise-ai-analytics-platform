server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # All /api/* requests are routed to the backend target group by the ALB.
  # The frontend container never receives /api/* traffic directly, so no
  # proxy_pass is needed here. Removing it also fixes the ECS startup error:
  #   nginx: [emerg] host not found in upstream "backend"

  location / {
    try_files $uri $uri/ /index.html;
  }
}
