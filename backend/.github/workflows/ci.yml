# =============================================================================
# Enterprise CI/CD Pipeline — Full-Stack AI Analytics Platform
# =============================================================================
# NOTE: This file must live at <repo-root>/.github/workflows/ci.yml
#       Move it from backend/.github/ to the repository root .github/ folder
#       so GitHub Actions can discover it.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   AWS_ACCOUNT_ID        — 12-digit AWS account number
#   AWS_REGION            — e.g. us-east-1
#   AWS_ACCESS_KEY_ID     — IAM key with ECR/ECS push permissions
#   AWS_SECRET_ACCESS_KEY — Corresponding secret
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - test
      - develop
      - main
  pull_request:
    branches:
      - test
      - develop
      - main

# Cancel in-flight runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ── Image names (update to match your ECR repos when ready) ────────────────
  BACKEND_IMAGE_NAME: ai-analytics-backend
  FRONTEND_IMAGE_NAME: ai-analytics-frontend
  # ── Python / Node versions (kept in one place for easy updates) ────────────
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

# =============================================================================
# JOB 1 — Lint & static validation (fast feedback, no Docker needed)
# =============================================================================
jobs:
  validate-backend:
    name: "Validate · Backend (FastAPI)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI app imports cleanly
        run: |
          echo "--- Verifying module structure ---"
          python -c "from app.main import app; print('FastAPI app loaded successfully')"

  # =============================================================================
  # JOB 2 — React / TypeScript build validation
  # =============================================================================
  validate-frontend:
    name: "Validate · Frontend (React + TypeScript)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type-check + Vite production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7

  # =============================================================================
  # JOB 3 — Build & cache backend Docker image
  # =============================================================================
  build-backend-image:
    name: "Docker · Build Backend Image"
    runs-on: ubuntu-latest
    needs: [validate-backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      # ── Compute a stable cache key from the requirements file ───────────────
      - name: Generate backend cache key
        id: cache-key
        run: |
          echo "key=backend-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'backend/Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}

      - name: Smoke-test backend container
        run: |
          echo "--- Starting backend container ---"
          docker run --rm -d \
            --name backend-smoke \
            --env-file <(echo -e "SNOWFLAKE_ACCOUNT=dummy\nSNOWFLAKE_USER=dummy\nSNOWFLAKE_PASSWORD=dummy\nSNOWFLAKE_DATABASE=dummy\nSNOWFLAKE_SCHEMA=dummy\nSNOWFLAKE_WAREHOUSE=dummy") \
            -p 8000:8000 \
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

          echo "--- Waiting for container to be ready (max 30s) ---"
          timeout 30 bash -c 'until docker exec backend-smoke curl -sf http://localhost:8000/health 2>/dev/null; do sleep 2; done' \
            || (echo "Container logs:"; docker logs backend-smoke; exit 1)

          echo "--- Health check passed ---"
          docker stop backend-smoke

      - name: Export backend image digest
        run: |
          docker inspect ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} \
            --format '{{index .RepoDigests 0}}' || true

  # =============================================================================
  # JOB 4 — Build & cache frontend Docker image
  # =============================================================================
  build-frontend-image:
    name: "Docker · Build Frontend Image"
    runs-on: ubuntu-latest
    needs: [validate-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}

      - name: Smoke-test frontend container (nginx serves files)
        run: |
          echo "--- Starting frontend container ---"
          docker run --rm -d \
            --name frontend-smoke \
            -p 8080:80 \
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

          echo "--- Waiting for nginx to respond (max 20s) ---"
          timeout 20 bash -c 'until curl -sf http://localhost:8080/ 2>/dev/null; do sleep 2; done' \
            || (echo "Container logs:"; docker logs frontend-smoke; exit 1)

          echo "--- Nginx health check passed ---"
          docker stop frontend-smoke

  # =============================================================================
  # JOB 5 — Integration: both images running together via docker-compose
  # =============================================================================
  integration:
    name: "Integration · Compose Stack"
    runs-on: ubuntu-latest
    needs: [build-backend-image, build-frontend-image]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Re-use cached layers so we don't rebuild from scratch
      - name: Restore backend image layer cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=backend

      - name: Restore frontend image layer cache
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend

      - name: Start compose stack
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker compose up -d
          echo "--- Waiting for services ---"
          sleep 10
          docker compose ps

      - name: Verify stack endpoints
        run: |
          echo "--- Backend /health ---"
          curl -sf http://localhost:8000/health | python3 -m json.tool

          echo "--- Frontend root ---"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8080/

      - name: Print compose logs (always, for visibility)
        if: always()
        run: docker compose logs --no-color

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v

  # =============================================================================
  # JOB 6 — Publish to ECR  (main branch only — ready for future activation)
  # =============================================================================
  publish-to-ecr:
    name: "Publish · Push to Amazon ECR"
    runs-on: ubuntu-latest
    needs: [integration]
    # Activate by removing the `false &&` condition once ECR repos exist
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      - name: Build & push frontend to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

  # =============================================================================
  # JOB 7 — Deploy to ECS  (main branch only — ready for future activation)
  # =============================================================================
  deploy-to-ecs:
    name: "Deploy · Amazon ECS"
    runs-on: ubuntu-latest
    needs: [publish-to-ecr]
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Backend ECS service update ──────────────────────────────────────────
      - name: Download backend ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ai-analytics-backend \
            --query taskDefinition \
            > backend-task-def.json

      - name: Render new backend task definition with updated image
        id: render-backend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: backend
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:  ${{ steps.render-backend-task.outputs.task-definition }}
          service:          ai-analytics-backend-service
          cluster:          ai-analytics-cluster
          wait-for-service-stability: true

      # ── Frontend ECS service update ─────────────────────────────────────────
      - name: Download frontend ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ai-analytics-frontend \
            --query taskDefinition \
            > frontend-task-def.json

      - name: Render new frontend task definition with updated image
        id: render-frontend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: frontend
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:  ${{ steps.render-frontend-task.outputs.task-definition }}
          service:          ai-analytics-frontend-service
          cluster:          ai-analytics-cluster
          wait-for-service-stability: true
